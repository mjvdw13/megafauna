<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <title>MegaFauna - Browser Fighting Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Patrick+Hand&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #2b2420;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            /* No scrolling, zooming, text selection or callouts when thumbs land on the game. */
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }
        /* Scale the 1280x720 canvas to fit the window while keeping 16:9. */
        #game-canvas {
            display: block;
            width: min(calc(100vw - 32px), calc((100vh - 32px) * 16 / 9));
            height: auto;
            aspect-ratio: 16 / 9;
            background-color: #16213e;
            border: 4px solid #2a1d17;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
        }
        /* With touch controls the game fills the screen: no frame, no margin. */
        body.touch { min-height: 100dvh; }
        body.touch #game-canvas {
            width: min(100vw, calc(100vh * 16 / 9));
            width: min(100vw, calc(100dvh * 16 / 9));
            border: 0;
            border-radius: 0;
            box-shadow: none;
        }

        /* ---- Touch controls (built by src/core/touch.js) ---- */
        #touch {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 5;
            font-family: 'Bangers', 'Segoe UI', sans-serif;
            letter-spacing: 1px;
            --b: clamp(52px, 15vmin, 76px);               /* face button size */
            --gap: calc(var(--b) * 1.08);                  /* diamond center to each button */
            --cx: calc(var(--b) * 1.75 + env(safe-area-inset-right));
            --cy: calc(var(--b) * 1.75 + 6px + env(safe-area-inset-bottom));
        }
        #touch[hidden], #touch [hidden] { display: none !important; }
        #touch .zone {
            position: absolute;
            left: 0; top: 56px; bottom: 0;
            width: 50%;
            pointer-events: auto;
        }
        #touch .stick {
            position: absolute;
            width: 112px; height: 112px;
            margin: -56px 0 0 -56px;
            border: 3px solid rgba(253, 243, 220, 0.6);
            border-radius: 50%;
            background: rgba(42, 29, 23, 0.3);
            pointer-events: none;
        }
        #touch .stick.idle {
            left: calc(96px + env(safe-area-inset-left));
            top: calc(100% - 96px - env(safe-area-inset-bottom));
            opacity: 0.45;
        }
        #touch .knob {
            position: absolute;
            left: 50%; top: 50%;
            width: 48px; height: 48px;
            margin: -24px 0 0 -24px;
            border-radius: 50%;
            background: rgba(242, 92, 59, 0.75);
            border: 3px solid #2a1d17;
        }
        #touch .btn {
            position: absolute;
            width: var(--b); height: var(--b);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            border: 3px solid rgba(42, 29, 23, 0.85);
            background: rgba(42, 29, 23, 0.45);
            color: #fdf3dc;
            font-size: calc(var(--b) * 0.27);
            text-shadow: 1px 1px 0 #2a1d17, -1px -1px 0 #2a1d17, 1px -1px 0 #2a1d17, -1px 1px 0 #2a1d17;
            pointer-events: auto;
        }
        #touch .btn.active { transform: scale(0.92); filter: brightness(1.35); }
        /* Face buttons in a diamond, like a controller: ✕ jump, □ attack, △ smash, ○ special. */
        #touch .btn.jump    { right: calc(var(--cx) - var(--b) / 2);              bottom: calc(var(--cy) - var(--gap) - var(--b) / 2); background: rgba(95, 184, 63, 0.55); }
        #touch .btn.attack  { right: calc(var(--cx) + var(--gap) - var(--b) / 2); bottom: calc(var(--cy) - var(--b) / 2);              background: rgba(47, 128, 201, 0.6); }
        #touch .btn.smash   { right: calc(var(--cx) - var(--b) / 2);              bottom: calc(var(--cy) + var(--gap) - var(--b) / 2); background: rgba(242, 92, 59, 0.6); }
        #touch .btn.special { right: calc(var(--cx) - var(--gap) - var(--b) / 2); bottom: calc(var(--cy) - var(--b) / 2);              background: rgba(214, 160, 40, 0.65); }
        /* Shield and grab sit above the diamond, like shoulder buttons. */
        #touch .btn.shield, #touch .btn.grab {
            width: calc(var(--b) * 0.95); height: calc(var(--b) * 0.62);
            border-radius: 14px;
            font-size: calc(var(--b) * 0.24);
            bottom: calc(var(--cy) + var(--gap) + var(--b) * 0.5 + 12px);
        }
        #touch .btn.shield { right: calc(8px + env(safe-area-inset-right)); background: rgba(130, 90, 200, 0.55); }
        #touch .btn.grab   { right: calc(var(--b) * 1.1 + 16px + env(safe-area-inset-right)); }
        #touch .btn.top {
            top: calc(8px + env(safe-area-inset-top));
            width: auto; height: 36px;
            padding: 0 14px;
            border-radius: 10px;
            font-size: 18px;
        }
        #touch .btn.mute { left: calc(8px + env(safe-area-inset-left)); }
        #touch .btn.exit { right: calc(8px + env(safe-area-inset-right)); }
        /* Sits on the invite card where "Press C to copy it" goes (y 400 of the 720-high canvas). */
        #touch .btn.share {
            left: 50%;
            top: calc(50% + min(100vh, 56.25vw) * 0.0556);
            top: calc(50% + min(100dvh, 56.25vw) * 0.0556);
            transform: translate(-50%, -50%);
            width: auto; height: 56px;
            padding: 0 28px;
            border-radius: 28px;
            font-size: 28px;
            background: rgba(242, 92, 59, 0.9);
        }
        #touch .btn.share.active { transform: translate(-50%, -50%) scale(0.95); }
        #rotate-hint {
            display: none;
            position: fixed;
            left: 0; right: 0; bottom: 24px;
            text-align: center;
            font: 28px 'Bangers', sans-serif;
            letter-spacing: 1px;
            color: #f7c948;
            pointer-events: none;
        }
        @media (orientation: portrait) {
            body.touch #rotate-hint { display: block; }
        }

        #file-warning {
            display: none;
            position: fixed; inset: 0;
            align-items: center; justify-content: center;
            color: #fff; text-align: center; padding: 24px;
            background: #1a1a2e; font-size: 18px; line-height: 1.6;
        }
        #file-warning code { background: #0f3460; padding: 2px 8px; border-radius: 4px; }
    </style>
</head>
<body>
    <canvas id="game-canvas" width="1280" height="720"></canvas>
    <div id="file-warning">
        <div>
            MegaFauna uses JavaScript modules, which browsers block on <code>file://</code> pages.<br>
            From the project folder run <code>npm start</code> and open <code>http://localhost:8080</code>.
        </div>
    </div>
    <script>
        if (location.protocol === 'file:') document.getElementById('file-warning').style.display = 'flex';
    </script>
    <!-- three.js is vendored (vendor/three); this maps the bare "three" imports to it. -->
    <script type="importmap">
        { "imports": { "three": "./vendor/three/three.module.min.js", "three/addons/": "./vendor/three/addons/" } }
    </script>
    <script type="module" src="src/main.js"></script>
</body>
</html>
