<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MegaFauna - Browser Fighting Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Patrick+Hand&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #2b2420;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        /* Scale the 1280x720 canvas to fit the window while keeping 16:9. */
        #game-canvas {
            display: block;
            width: min(calc(100vw - 32px), calc((100vh - 32px) * 16 / 9));
            height: auto;
            aspect-ratio: 16 / 9;
            background-color: #16213e;
            border: 4px solid #2a1d17;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
        }
        #file-warning {
            display: none;
            position: fixed; inset: 0;
            align-items: center; justify-content: center;
            color: #fff; text-align: center; padding: 24px;
            background: #1a1a2e; font-size: 18px; line-height: 1.6;
        }
        #file-warning code { background: #0f3460; padding: 2px 8px; border-radius: 4px; }
    </style>
</head>
<body>
    <canvas id="game-canvas" width="1280" height="720"></canvas>
    <div id="file-warning">
        <div>
            MegaFauna uses JavaScript modules, which browsers block on <code>file://</code> pages.<br>
            From the project folder run <code>npm start</code> and open <code>http://localhost:8080</code>.
        </div>
    </div>
    <script>
        if (location.protocol === 'file:') document.getElementById('file-warning').style.display = 'flex';
    </script>
    <!-- three.js is vendored (vendor/three); this maps the bare "three" imports to it. -->
    <script type="importmap">
        { "imports": { "three": "./vendor/three/three.module.min.js", "three/addons/": "./vendor/three/addons/" } }
    </script>
    <script type="module" src="src/main.js"></script>
</body>
</html>
